# The upstream sources GoIDEA is built from. scripts/upstream-check.sh reads
# this file and reports anything that moved; nothing else may pin them.
schema: 1
project:
  name: GoIDEA
  repository: https://github.com/misswell/GoIdea
  default_branch: main
  version: 0.1.0

upstreams:
  mayoi:
    url: https://github.com/sorrycc/Mayoi
    fork: https://github.com/misswell/Mayoi
    # The fork is this repository's base: its history is merged into main
    # through the `mayoi` remote, so upstream commits arrive with git merge.
    remote: mayoi
    default_branch: main
    commit: 89bc891e74cb2b759eaf0ef087401b021313859b
    version: 0.19.3
    synced_at: 2026-11-13
    license: MIT
    sync: fork-merge
    local_changes:
      - added cmd/goidea and internal/app, internal/openidea, internal/docbridge, internal/position, internal/textdiff
      - the Go module path is mayoi, the same the fork uses, so inherited imports are untouched
      - root README.md, LICENSE, NOTICE, mygo.json, .gitignore and .github/workflows/ci.yml are GoIDEA's
      - removed .github/workflows/test.yml and website.yml: they need Mayoi's CI matrix and Cloudflare secrets
    watch:
      - commit
      - release
      - tag

  mygo:
    url: https://github.com/egoist/mygo
    fork: https://github.com/sorrycc/mygo
    default_branch: main
    # The replacement in go.mod resolves here; the pseudo-version has the
    # same commit.
    commit: f970e709191126e80e73e721b6b7b9c41cf358ab
    module_version: v0.4.9-0.20261106101517-f970e7091911
    synced_at: 2026-11-13
    license: MIT
    sync: go-module-replace
    local_changes: none-to-fork
    watch:
      - commit
      - tag
      - go-module

  openidea:
    url: https://github.com/l0ng-ai/openidea
    fork: https://github.com/misswell/openidea
    default_branch: main
    # The Rust source is a submodule pinned to the commit the RPC client was
    # tested against; the shipped server is the release build below.
    submodule: third_party/openidea
    commit: 551428267deddd600b367fa01d2b80c6146f1576
    version: 0.1.41
    synced_at: 2026-11-13
    license: Apache-2.0
    sync: fork-submodule
    # The server GoIDEA ships is the official release asset for
    # macos-aarch64, verified against the release's SHA-256.
    server:
      release: v0.1.41
      release_commit: 108da537f4e93fc4aff9a3f089aa02d835795e3f
      asset: openidea-server-macos-aarch64.gz
      sha256_file: openidea-server-macos-aarch64.gz.sha256
    local_changes: none-to-upstream
    watch:
      - commit
      - release
      - rpc-contract
