name: Release

# Builds, signs, notarizes and publishes GoIDEA when a v* tag is pushed. The
# tag must match mygo.json's version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency: release

jobs:
  guard:
    # A tag can be published by hand before the signing secrets exist. The
    # workflow then says so instead of showing a failed release.
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [[ -n "$CERT" ]]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::MACOS_CERTIFICATE is not configured; publish this tag from a Mac with scripts/release.sh"
          fi

  release:
    needs: guard
    if: needs.guard.outputs.ready == 'yes'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check the tag against mygo.json
        run: |
          version="$(jq -r .version mygo.json)"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME, but mygo.json has $version"; exit 1; }
      - name: Import the certificate and the notary credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials goidea-notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          test -n "$identity" || { echo "::error::no Developer ID Application identity"; exit 1; }
          echo "GOIDEA_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "GOIDEA_NOTARY_PROFILE=goidea-notary" >> "$GITHUB_ENV"
      - name: Build, sign, notarize
        run: scripts/release.sh darwin/arm64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="$(find build -maxdepth 3 -name 'goidea-*.dmg' | head -1)"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "GoIDEA ${GITHUB_REF_NAME#v}" --generate-notes \
            "$dmg" "$dmg.sha256"
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
