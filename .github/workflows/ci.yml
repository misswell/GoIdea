name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One command list: the workflow calls the same scripts/gate.sh the release
# machine runs, so CI and local gating cannot drift.

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch all history: the pin checks compare the source against the
          # release commit, and a shallow submodule lacks that commit.
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: PR gate
        run: scripts/gate.sh pr

  # GitHub hosted macOS runners are not available to this account yet: the
  # jobs wait for the ENABLE_MACOS_CI repository variable instead of being
  # cancelled before a runner is assigned. The goal requires a real macOS
  # runner for JDT, the debugger and the e2e; a Linux-only run is not that.
  main:
    if: vars.ENABLE_MACOS_CI == 'true' && github.event_name != 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch all history: the pin checks compare the source against the
          # release commit, and a shallow submodule lacks that commit.
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fetch pinned server
        run: scripts/fetch-server.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Main gate
        run: scripts/gate.sh main
        env:
          GOIDEA_E2E_DATA: ${{ runner.temp }}/goidea-e2e-data

  release:
    if: vars.ENABLE_MACOS_CI == 'true' && github.event_name != 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch all history: the pin checks compare the source against the
          # release commit, and a shallow submodule lacks that commit.
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fetch pinned server
        run: scripts/fetch-server.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Release gate (toolchain, JDT, debugger)
        run: scripts/gate.sh release
        env:
          GOIDEA_E2E_DATA: ${{ runner.temp }}/goidea-e2e-data
