name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    # GitHub hosted macOS runners are not available to this account: the job is
    # cancelled before a runner is assigned. Enable it by setting the
    # ENABLE_MACOS_CI repository variable once they are.
    if: matrix.os != 'macos-14' || vars.ENABLE_MACOS_CI == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test
        run: CGO_ENABLED=0 go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/goidea ./cmd/goidea
      - name: Licenses
        if: runner.os == 'macOS'
        run: scripts/check-licenses.sh
